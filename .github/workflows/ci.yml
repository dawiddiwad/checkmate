name: CI

on:
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    timeout-minutes: 10
    env:
      CHECKMATE_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CHECKMATE_MODEL: ${{ secrets.OPENAI_MODEL }}

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: current
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run example e2e tests
        run: npm run test:web:example
