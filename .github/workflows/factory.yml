name: Checkmate factory
on:
  workflow_dispatch:
    inputs:
      source:
        description: Where to read the change request
        type: choice
        required: true
        options: [issue, prompt, file]
      request:
        description: GitHub issue number or URL, prompt text, or file path or link
        type: string
        required: true
      config:
        description: Factory YAML configuration path
        type: string
        default: factory.yml

permissions:
  contents: read
  issues: read

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CHECKMATE_BROWSER_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install -g @earendil-works/pi-coding-agent@1.5.2
      - name: Configure Pi host authentication
        env:
          CHECKMATE_FACTORY_PI_AUTH: ${{ secrets.CHECKMATE_FACTORY_PI_AUTH }}
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/checkmate-pi"
          node --input-type=module - "$RUNNER_TEMP/checkmate-pi/auth.json" <<'NODE'
          import { writeFileSync } from 'node:fs'
          const text = process.env.CHECKMATE_FACTORY_PI_AUTH
          let auth
          try { auth = JSON.parse(text) } catch {}
          if (!auth || typeof auth !== 'object' || Array.isArray(auth) || !Object.keys(auth).length) {
            throw new Error('Set CHECKMATE_FACTORY_PI_AUTH to a valid Pi auth.json with provider authentication.')
          }
          writeFileSync(process.argv[2], text, { mode: 0o600, flag: 'wx' })
          NODE
      - name: Run the factory
        env:
          FACTORY_SOURCE: ${{ inputs.source }}
          FACTORY_REQUEST: ${{ inputs.request }}
          FACTORY_CONFIG: ${{ inputs.config }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$FACTORY_SOURCE" in
            issue|prompt|file) ;;
            *) echo 'Select issue, prompt, or file.' >&2; exit 1 ;;
          esac
          export PI_CODING_AGENT_DIR="$RUNNER_TEMP/checkmate-pi"
          result=0
          node scripts/factory.mjs start "--$FACTORY_SOURCE=$FACTORY_REQUEST" \
            --config "${FACTORY_CONFIG:-factory.yml}" --output "$RUNNER_TEMP/checkmate-factory" || result=$?
          case "$result" in
            0) echo 'Checkmate passed the factory candidate.' >> "$GITHUB_STEP_SUMMARY" ;;
            2) echo 'The factory needs a product decision. Download the campaign artifact and read `decisions.json`.' >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo 'The factory stopped. Download the campaign artifact and read `status.json`.' >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          exit "$result"
      - name: Upload the factory campaign
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkmate-factory-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/checkmate-factory/campaign.json
            ${{ runner.temp }}/checkmate-factory/status.json
            ${{ runner.temp }}/checkmate-factory/decisions.json
            ${{ runner.temp }}/checkmate-factory/candidate.bundle
            ${{ runner.temp }}/checkmate-factory/records/request.md
            ${{ runner.temp }}/checkmate-factory/records/decisions.md
            ${{ runner.temp }}/checkmate-factory/records/preview.md
            ${{ runner.temp }}/checkmate-factory/records/.checkmate/
            !${{ runner.temp }}/checkmate-factory/records/.checkmate/hook-token
            !${{ runner.temp }}/checkmate-factory/records/.checkmate/ui.json
            !${{ runner.temp }}/checkmate-factory/records/.checkmate/ui-server.log
            !${{ runner.temp }}/checkmate-factory/records/.checkmate/tmp/
            !${{ runner.temp }}/checkmate-factory/records/.checkmate/**/.git/
            !${{ runner.temp }}/checkmate-factory/records/.checkmate/**/node_modules/
